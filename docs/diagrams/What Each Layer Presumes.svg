<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&amp;display=swap');
      text {
        font-family: 'Kalam', 'Virgil', 'Segoe UI', sans-serif;
        font-weight: 400;
      }
      .title { font-size: 26px; }
      .subtitle { font-size: 17px; }
      .arrow-label { font-size: 16px; }
      .caption { font-size: 18px; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="1536" height="1024" fill="white"/>

  <!-- Title -->
  <text x="768" y="65" text-anchor="middle" class="title" fill="#111827"
        style="font-weight:700; font-size:32px;">What Each Layer Presumes</text>

  <!-- ========== LEFT COLUMN (top-down labels) ========== -->
  <text x="100" y="270" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">top-down:</text>
  <text x="100" y="295" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">what the field</text>
  <text x="100" y="320" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">builds</text>

  <!-- ========== RIGHT COLUMN (bottom-up labels) ========== -->
  <text x="1436" y="680" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">bottom-up:</text>
  <text x="1436" y="705" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">what each layer</text>
  <text x="1436" y="730" text-anchor="middle" class="arrow-label" fill="#9CA3AF"
        style="font-size:15px;">requires first</text>

  <!-- ========== CENTER STACK ========== -->

  <!-- Box 1: Enterprise AI Engineering -->
  <rect x="268" y="115" width="1000" height="100" rx="20" ry="20"
        fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="768" y="165" text-anchor="middle" class="title" fill="#1F2937">Enterprise AI Engineering</text>
  <text x="768" y="198" text-anchor="middle" class="subtitle" fill="#6B7280">the field builds this</text>

  <!-- Arrow 1: presumes -->
  <line x1="768" y1="215" x2="768" y2="265" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="768,272 762,260 774,260" fill="#9CA3AF"/>
  <text x="820" y="248" class="arrow-label" fill="#6B7280">presumes</text>

  <!-- Box 2: Graph Engineering · Loop Engineering · … -->
  <rect x="268" y="272" width="1000" height="100" rx="20" ry="20"
        fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <text x="768" y="322" text-anchor="middle" class="title" fill="#1F2937">Graph Engineering · Loop Engineering · …</text>
  <text x="768" y="355" text-anchor="middle" class="subtitle" fill="#6B7280">designs graphs, loops, memory</text>

  <!-- Arrow 2: presumes -->
  <line x1="768" y1="372" x2="768" y2="422" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="768,429 762,417 774,417" fill="#9CA3AF"/>
  <text x="820" y="405" class="arrow-label" fill="#6B7280">presumes</text>

  <!-- Box 3: Enterprise AI Harness -->
  <rect x="268" y="429" width="1000" height="100" rx="20" ry="20"
        fill="none" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="768" y="479" text-anchor="middle" class="title" fill="#1F2937">Enterprise AI Harness</text>
  <text x="768" y="512" text-anchor="middle" class="subtitle" fill="#6B7280">holds boundaries &amp; identity</text>

  <!-- Arrow 3: presumes -->
  <line x1="768" y1="529" x2="768" y2="579" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="768,586 762,574 774,574" fill="#9CA3AF"/>
  <text x="820" y="562" class="arrow-label" fill="#6B7280">presumes</text>

  <!-- Box 4: Architectural Properties -->
  <rect x="268" y="586" width="1000" height="100" rx="20" ry="20"
        fill="none" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="768" y="636" text-anchor="middle" class="title" fill="#1F2937">Architectural Properties</text>
  <text x="768" y="669" text-anchor="middle" class="subtitle" fill="#6B7280">isolation, attribution, audit</text>

  <!-- Arrow 4: enables -->
  <line x1="768" y1="686" x2="768" y2="736" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="768,743 762,731 774,731" fill="#9CA3AF"/>
  <text x="820" y="719" class="arrow-label" fill="#6B7280">enables</text>

  <!-- Box 5: Trustworthy Enterprise Execution -->
  <rect x="268" y="743" width="1000" height="100" rx="20" ry="20"
        fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="768" y="793" text-anchor="middle" class="title" fill="#1F2937">Trustworthy Enterprise Execution</text>
  <text x="768" y="826" text-anchor="middle" class="subtitle" fill="#6B7280">the outcome</text>

  <!-- Divider line -->
  <line x1="200" y1="890" x2="1336" y2="890" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/>

  <!-- Caption -->
  <text x="768" y="940" text-anchor="middle" class="caption" fill="#4B5563">Read top-down: what the field builds.</text>
  <text x="768" y="975" text-anchor="middle" class="caption" fill="#4B5563">Read bottom-up: what each layer requires to exist first.</text>

</svg>